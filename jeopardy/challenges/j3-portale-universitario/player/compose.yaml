name: girello-j3

services:
  portal:
    image: girello/j3-portale-universitario:1.0
    platform: linux/amd64
    pull_policy: never
    restart: "no"
    ports:
      - "127.0.0.1:18083:8000"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 15s
    networks:
      - local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  local:
    driver: bridge