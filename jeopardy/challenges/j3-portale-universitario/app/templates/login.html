{% extends "base.html" %}
{% block title %}Accesso{% endblock %}
{% block content %}
<section class="card login">
  <p class="eyebrow">AREA RISERVATA</p>
  <h1>I tuoi documenti, in un unico posto.</h1>
  <p>Accedi per consultare le comunicazioni della segreteria.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="username">Nome utente</label>
    <input id="username" name="username" autocomplete="username" maxlength="80" required>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" autocomplete="current-password" maxlength="128" required>
    <button type="submit">Accedi</button>
  </form>
</section>
{% endblock %}
