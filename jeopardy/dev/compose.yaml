# Istanza CTFd di sviluppo da eseguire sul PC, con dati di prova.
name: girello-jeopardy-dev

services:
  ctfd:
    image: ctfd/ctfd:3.8.7@sha256:284f1f06c5464108c4eaaea8a28934cb1e81d491e3f0fe60f3d686cf38593e41
    platform: linux/amd64
    pull_policy: missing
    restart: "no"
    stop_grace_period: 30s

    ports:
      - "127.0.0.1:18080:8000"

    environment:
      SECRET_KEY: ${JEO_DEV_SECRET_KEY:?Configurare il file .env locale}
      DATABASE_URL: mysql+pymysql://ctfd:${JEO_DEV_DB_PASSWORD:?Configurare il file .env locale}@db/ctfd
      REDIS_URL: redis://:${JEO_DEV_REDIS_PASSWORD:?Configurare il file .env locale}@redis:6379/0
      UPLOAD_FOLDER: /var/uploads
      LOG_FOLDER: /var/log/CTFd
      ACCESS_LOG: "-"
      ERROR_LOG: "-"
      WORKERS: "1"
      REVERSE_PROXY: "false"
      UPDATE_CHECK: "false"

    volumes:
      - ctfd_uploads:/var/uploads
      - ctfd_logs:/var/log/CTFd

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - front
      - data

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).close()" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mariadb:10.11.19@sha256:ce66c7be32a03aabe7241d0a10993a2db827ef652a35d25727d92a832ac8ef73
    platform: linux/amd64
    pull_policy: missing
    restart: "no"
    stop_grace_period: 60s

    environment:
      MARIADB_ROOT_PASSWORD: ${JEO_DEV_DB_ROOT_PASSWORD:?Configurare il file .env locale}
      MARIADB_ROOT_HOST: localhost
      MARIADB_DATABASE: ctfd
      MARIADB_USER: ctfd
      MARIADB_PASSWORD: ${JEO_DEV_DB_PASSWORD:?Configurare il file .env locale}

    command:
      - mariadbd
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      - db_data:/var/lib/mysql

    networks:
      - data

    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4.11@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
    platform: linux/amd64
    pull_policy: missing
    restart: "no"
    stop_grace_period: 30s

    command:
      - redis-server
      - --bind
      - "0.0.0.0"
      - --protected-mode
      - "yes"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${JEO_DEV_REDIS_PASSWORD:?Configurare il file .env locale}

    environment:
      REDISCLI_AUTH: ${JEO_DEV_REDIS_PASSWORD:?Configurare il file .env locale}

    volumes:
      - redis_data:/data

    networks:
      - data

    healthcheck:
      test: [CMD-SHELL, 'test "$$(redis-cli --raw ping)" = PONG']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  front:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  ctfd_uploads:
  ctfd_logs:
  db_data:
  redis_data: