name: girello-ad-dev

services:
  document-vault:
    build: ./services/document-vault
    image: girello/document-vault:dev
    platform: linux/amd64
    ports:
      # Sviluppo: il servizio e' raggiungibile soltanto dal localhost della VM.
      - "127.0.0.1:8081:8081"
    volumes:
      # SQLite e documenti sopravvivono alla ricreazione del container.
      - vault-data:/data
    # Il filesystem dell'immagine e' in sola lettura; /data resta scrivibile.
    read_only: true
    tmpfs:
      # Spazio temporaneo per Gunicorn e le richieste, senza dati persistenti.
      - /tmp:rw,nosuid,nodev,size=32m,mode=1777
    # Il servizio non richiede capability Linux ne' acquisizione di privilegi.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # In sviluppo avviamo e arrestiamo il servizio esplicitamente.
    restart: "no"

  helpdesk:
    build: ./services/helpdesk
    image: girello/helpdesk:dev
    platform: linux/amd64
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - helpdesk-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  vault-data:
  helpdesk-data:
