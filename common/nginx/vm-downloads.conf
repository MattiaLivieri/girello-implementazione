# Download delle OVA autorizzati dal plugin CTFd.
location ^~ /_girello_vm/ {
    # Il browser non può accedere direttamente a questo percorso.
    # CTFd lo seleziona dopo aver verificato l'utente.
    internal;

    # Directory del Master che contiene le versioni delle OVA.
    alias /srv/girello/distribution/ad/;

    autoindex off;
    default_type application/octet-stream;
    sendfile on;
    add_header Cache-Control "private, no-store" always;
}
