# Jeopardy: accesso dei partecipanti al portale sulla rete del laboratorio.
# Da includere nel blocco http, insieme a ctfd-local.conf.

server {
    listen 10.77.10.2:80;
    server_name 10.77.10.2;

    # Collegamento HTTP verso CTFd e informazioni della richiesta.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Rimuove gli ulteriori header di inoltro non utilizzati.
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    proxy_redirect off;
    proxy_connect_timeout 5s;

    # Inoltra le notifiche appena arrivano, senza buffering o cache.
    location /events {
        proxy_pass http://girello_ctfd_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # Pagine, allegati e richieste al portale raggiungono lo stesso CTFd.
    location / {
        proxy_pass http://girello_ctfd_backend;
    }
}
