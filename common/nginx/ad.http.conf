# Attack & Defense: accessi HTTP dai due segmenti dei team.
# Da includere nel blocco http, insieme a ctfd-local.conf.

# Team 1: accesso al portale CTFd.
server {
    listen 10.77.1.1:80;
    server_name 10.77.1.1;

    # Inoltra a CTFd le informazioni della richiesta viste da Nginx.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    proxy_redirect off;
    proxy_connect_timeout 5s;

    # Mantiene il flusso delle notifiche del portale.
    location /events {
        proxy_pass http://girello_ctfd_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://girello_ctfd_backend;
    }
}

# Team 2: accesso alla stessa istanza CTFd dal proprio segmento.
server {
    listen 10.77.2.1:80;
    server_name 10.77.2.1;

    # Applica le stesse impostazioni del portale sul segmento del Team 2.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    proxy_redirect off;
    proxy_connect_timeout 5s;

    location /events {
        proxy_pass http://girello_ctfd_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://girello_ctfd_backend;
    }
}

# Team 1: accesso all'applicazione di gara A&D sul Master.
server {
    listen 10.77.1.2:8080;
    server_name 10.77.1.2;

    location / {
        # Il backend dell'applicazione e' distinto da CTFd.
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
    }
}

# Team 2: accesso alla stessa applicazione A&D dal proprio segmento.
server {
    listen 10.77.2.2:8080;
    server_name 10.77.2.2;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
    }
}
