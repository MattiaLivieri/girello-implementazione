# Accesso locale al portale CTFd dal Master.
# Questo file viene incluso nel blocco http della configurazione Nginx.

# Il nome identifica il portale pubblicato da Docker sul loopback.
upstream girello_ctfd_backend {
    server 127.0.0.1:18000;
}

server {
    # Questo ingresso sulla porta 80 e' raggiungibile solo dal Master.
    listen 127.0.0.1:80 default_server;
    server_name localhost 127.0.0.1;

    # Usa HTTP/1.1 verso CTFd e non inoltra l'header Connection del client.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Comunica a CTFd host, indirizzo client e protocollo visti da Nginx.
    # Gli header di inoltro sono riscritti, non accettati dal client.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Questi ulteriori header di inoltro non sono usati e vengono rimossi.
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";

    # Mantiene gli indirizzi di reindirizzamento restituiti da CTFd.
    proxy_redirect off;

    # Attende al massimo 5 secondi per aprire la connessione verso CTFd.
    proxy_connect_timeout 5s;

    # Le notifiche usano un flusso continuo di eventi dal portale.
    location /events {
        proxy_pass http://girello_ctfd_backend;

        # Inoltra i dati appena arrivano, senza accumularli o conservarli in cache.
        proxy_buffering off;
        proxy_cache off;

        # Consente fino a un'ora senza nuovi dati dal portale.
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # Tutte le altre richieste vengono inoltrate normalmente a CTFd.
    location / {
        proxy_pass http://girello_ctfd_backend;
    }
}
