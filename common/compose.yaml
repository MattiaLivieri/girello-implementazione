# Servizi centrali di Girello sul Master.
# Le immagini devono essere disponibili localmente prima dell'avvio.
name: girello

services:
  ctfd:
    image: ctfd/ctfd:3.8.7@sha256:284f1f06c5464108c4eaaea8a28934cb1e81d491e3f0fe60f3d686cf38593e41
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    stop_grace_period: 30s

    # Nginx raggiunge il portale attraverso questo ingresso locale.
    ports:
      - "127.0.0.1:18000:8000"

    # I valori delle credenziali provengono dal file passato a --env-file.
    environment:
      SECRET_KEY: ${CTFD_SECRET_KEY:?Credenziale mancante}
      DATABASE_URL: mysql+pymysql://ctfd:${CTFD_DB_PASSWORD:?Credenziale mancante}@db/ctfd
      REDIS_URL: redis://:${CTFD_REDIS_PASSWORD:?Credenziale mancante}@redis:6379/0
      UPLOAD_FOLDER: /var/uploads
      LOG_FOLDER: /var/log/CTFd
      ACCESS_LOG: "-"
      ERROR_LOG: "-"
      WORKERS: "1"
      # Un proxy attendibile per indirizzo client, protocollo e host.
      REVERSE_PROXY: "1,1,1,0,0"
      UPDATE_CHECK: "false"

    # Queste directory conservano i file anche ricreando il container.
    volumes:
      - /srv/girello/ctfd/uploads:/var/uploads
      - /srv/girello/ctfd/logs:/var/log/CTFd

    # CTFd viene avviato quando database e cache rispondono ai controlli.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - ctfd_front
      - ctfd_data

    # Il controllo richiede la pagina del portale dall'interno del container.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).close()
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

    # Limita lo spazio occupato dai log raccolti da Docker.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mariadb:10.11.19@sha256:ce66c7be32a03aabe7241d0a10993a2db827ef652a35d25727d92a832ac8ef73
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    stop_grace_period: 60s

    # Database e utente applicativo vengono creati alla prima inizializzazione.
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Credenziale mancante}
      MARIADB_ROOT_HOST: localhost
      MARIADB_DATABASE: ctfd
      MARIADB_USER: ctfd
      MARIADB_PASSWORD: ${CTFD_DB_PASSWORD:?Credenziale mancante}

    command:
      - mariadbd
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      - /srv/girello/ctfd/db:/var/lib/mysql

    # Il database usa soltanto la rete dati e non pubblica porte sul Master.
    networks:
      - ctfd_data

    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4.11@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    stop_grace_period: 30s

    command: [redis-server, /usr/local/etc/redis/redis.conf]

    # redis-cli usa questa password nel controllo di disponibilità.
    environment:
      REDISCLI_AUTH: ${CTFD_REDIS_PASSWORD:?Credenziale mancante}

    volumes:
      - /srv/girello/ctfd/redis:/data
      # Il file contiene la configurazione e la password effettiva di Redis.
      - type: bind
        source: /srv/girello/secrets/redis.conf
        target: /usr/local/etc/redis/redis.conf
        read_only: true
        bind:
          create_host_path: false

    networks:
      - ctfd_data

    healthcheck:
      # Il controllo riesce solo se Redis risponde PONG.
      # $$ lascia il simbolo $ alla shell del container.
      test: [CMD-SHELL, 'test "$$(redis-cli --raw ping)" = PONG']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ctfd_front:
    name: girello_ctfd_front
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24

  # Rete interna condivisa da CTFd, MariaDB e Redis.
  ctfd_data:
    name: girello_ctfd_data
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.11.0/24
